<!doctype html>
<html lang="en" data-theme="%wiki.theme%">
  <head>
    <meta charset="utf-8" />
    <style>
      %wiki.critical-theme-css%
    </style>
    <style>
      %wiki.reading-prefs-css%
    </style>
    <meta name="theme-color" content="%wiki.theme-color%" />
    <link
      rel="icon"
      type="image/png"
      href="%sveltekit.assets%/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon/favicon.svg" />
    <link rel="shortcut icon" href="%sveltekit.assets%/favicon/favicon.ico" />
    <meta name="apple-mobile-web-app-title" content="Wiki" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%sveltekit.assets%/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="%sveltekit.assets%/favicon/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css?family=atkinson-hyperlegible:400,400i,700,700i&family=roboto:400,400i,700&family=merriweather:400,400i,700&family=space-mono:400,400i,700,700i&family=lato:400,400i,700&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
