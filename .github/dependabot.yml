# Use the bun ecosystem so PRs update bun.lock (npm ecosystem only touched package.json).
version: 2
enable-beta-ecosystems: true

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      svelte:
        patterns:
          - '@sveltejs/*'
          - 'svelte*'
      dev-tools:
        dependency-type: development
        update-types:
          - patch
          - minor
        patterns:
          - '*'
    ignore:
      # Major bumps need manual code + lockfile review (syntax highlighting API, icons, Vite).
      - dependency-name: '@shikijs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'lucide-svelte'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
