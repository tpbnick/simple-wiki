services:
  wiki:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - wiki-data:/data
      - wiki-uploads:/uploads
    environment:
      DATABASE_PATH: /data/wiki.db
      UPLOADS_DIR: /uploads
      PORT: 3000
      COOKIE_SECURE: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  wiki-data:
  wiki-uploads:
