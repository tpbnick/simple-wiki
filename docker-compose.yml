services:
  wiki:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - wiki-data:/data
      - wiki-uploads:/uploads
    environment:
      DATABASE_PATH: /data/wiki.db
      UPLOADS_DIR: /uploads
      PORT: 3000
      # LAN / home network: plain HTTP on port 3000 (default for self-hosting)
      COOKIE_SECURE: 'false'
      # Internet-facing: use HTTPS in front and set COOKIE_SECURE=true, WIKI_ORIGIN=https://...
      # PRIVATE_WIKI: PUBLIC_READ=false
      # Reverse proxy rate limits: ADDRESS_HEADER=x-forwarded-for, XFF_DEPTH=1
      # BODY_SIZE_LIMIT defaults to 512M in the Docker image
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  wiki-data:
  wiki-uploads:
